version: 2
updates:
  # The runtime dependency (qingping-cgd1) is pinned in manifest.json, which
  # dependabot cannot track; this is dev toolchain only.
  - package-ecosystem: uv
    directory: "/"
    schedule:
      interval: weekly
    groups:
      dev-dependencies:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
